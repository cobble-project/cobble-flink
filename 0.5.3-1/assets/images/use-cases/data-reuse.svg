<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="data-reuse-title data-reuse-desc"><title id="data-reuse-title">Write once. Read in another job.</title><desc id="data-reuse-desc">One Flink job publishes sink output or supported keyed state; other Flink jobs scan or look up completed snapshots through the same Cobble storage layer.</desc><defs><marker id="arrow-655f55" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#655f55"/></marker><marker id="arrow-89643b" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#89643b"/></marker><marker id="arrow-3f6579" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3f6579"/></marker></defs><rect x="0" y="0" width="1280" height="680" rx="8" fill="#faf8f3" stroke="none" stroke-width="1.4"/><text x="48" y="44" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#89643b" font-weight="600" text-anchor="start">COBBLE FLINK / 03</text><text x="48" y="96" font-family="Georgia, serif" font-size="36" fill="#302d28" font-weight="400" text-anchor="start">Write once. Read in another job.</text><text x="48" y="132" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Scans and key lookups turn stored data into reusable inputs.</text><rect x="48" y="408" width="1184" height="168" rx="8" fill="#eaf0f2" stroke="#c8c0b3" stroke-width="1.4"/><text x="744" y="448" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Cobble storage layer</text><path d="M236 300 V480" fill="none" stroke="#89643b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-89643b)"/><path d="M660 480 V300" fill="none" stroke="#3f6579" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3f6579)"/><path d="M1060 480 V300" fill="none" stroke="#3f6579" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3f6579)"/><rect x="244" y="342" width="93" height="30" rx="8" fill="#faf8f3" stroke="none" stroke-width="1.4"/><text x="252" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#89643b" font-weight="400" text-anchor="start">PUBLISH</text><rect x="668" y="342" width="60" height="30" rx="8" fill="#faf8f3" stroke="none" stroke-width="1.4"/><text x="676" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#3f6579" font-weight="400" text-anchor="start">SCAN</text><rect x="1068" y="342" width="82" height="30" rx="8" fill="#faf8f3" stroke="none" stroke-width="1.4"/><text x="1076" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#3f6579" font-weight="400" text-anchor="start">LOOKUP</text><rect x="48" y="184" width="376" height="116" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="72" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Flink writer</text><text x="72" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Sink output or managed state</text><rect x="496" y="184" width="328" height="116" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="520" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Another Flink job</text><text x="520" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Read a dataset</text><rect x="896" y="184" width="336" height="116" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="920" y="224" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Another Flink job</text><text x="920" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Enrich a customer record</text><rect x="80" y="480" width="348" height="72" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="104" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Completed snapshots</text><rect x="464" y="480" width="340" height="72" rx="8" fill="#f0e9dd" stroke="#89643b" stroke-width="1.4"/><text x="488" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Records + schema</text><rect x="840" y="480" width="360" height="72" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="864" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Keys + business fields</text><path d="M48 616 H1232" fill="none" stroke="#c8c0b3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="652" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#655f55" font-weight="400" text-anchor="start">Schema enables readers to interpret stored records. Support for more engines is being added.</text></svg>