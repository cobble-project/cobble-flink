<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="flexible-storage-title flexible-storage-desc"><title id="flexible-storage-title">Flexible storage, managed by the core</title><desc id="flexible-storage-desc">The Cobble core manages local disk and remote storage, with hybrid or local-cache policies for Flink state.</desc><defs><marker id="arrow-655f55" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#655f55"/></marker><marker id="arrow-89643b" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#89643b"/></marker><marker id="arrow-3f6579" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3f6579"/></marker></defs><rect x="0" y="0" width="1280" height="680" rx="8" fill="#faf8f3" stroke="none" stroke-width="1.4"/><text x="48" y="44" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#89643b" font-weight="600" text-anchor="start">COBBLE FLINK / 01</text><text x="48" y="96" font-family="Georgia, serif" font-size="36" fill="#302d28" font-weight="400" text-anchor="start">Flexible storage, managed by the core</text><text x="48" y="132" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Use local capacity fully. Let remote storage extend it.</text><path d="M460 264 V312" fill="none" stroke="#89643b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-89643b)"/><path d="M320 420 V476" fill="none" stroke="#89643b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-89643b)"/><path d="M600 420 V476" fill="none" stroke="#3f6579" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3f6579)"/><rect x="128" y="168" width="664" height="96" rx="8" fill="white" stroke="#c8c0b3" stroke-width="1.4"/><text x="152" y="208" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Apache Flink</text><text x="152" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Stateful processing · Flink 1.17+</text><rect x="128" y="312" width="664" height="108" rx="8" fill="#f0e9dd" stroke="#89643b" stroke-width="1.4"/><text x="152" y="352" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Cobble core</text><text x="152" y="384" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Storage policy and hot / cold tiering</text><rect x="128" y="476" width="316" height="104" rx="8" fill="#f0e9dd" stroke="#c8c0b3" stroke-width="1.4"/><text x="152" y="516" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Local disk</text><text x="152" y="548" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Active tier or cache</text><rect x="476" y="476" width="316" height="104" rx="8" fill="#eaf0f2" stroke="#c8c0b3" stroke-width="1.4"/><text x="500" y="516" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#302d28" font-weight="600" text-anchor="start">Remote storage</text><text x="500" y="548" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Durable capacity</text><text x="880" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#655f55" font-weight="600" text-anchor="start">CHOOSE YOUR POLICY</text><text x="880" y="264" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#302d28" font-weight="600" text-anchor="start">Hybrid storage</text><text x="880" y="296" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Local + remote active tiers</text><text x="880" y="360" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#302d28" font-weight="600" text-anchor="start">Local as cache</text><text x="880" y="392" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#655f55" font-weight="400" text-anchor="start">Remote working files</text><text x="880" y="540" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#89643b" font-weight="600" text-anchor="start">↓  Balance cost</text><text x="880" y="492" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#3f6579" font-weight="600" text-anchor="start">↑  Keep performance</text><path d="M48 616 H1232" fill="none" stroke="#c8c0b3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="652" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#655f55" font-weight="400" text-anchor="start">Storage and compute separation starting with Flink 1.17.</text></svg>