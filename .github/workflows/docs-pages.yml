name: Deploy Docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release documentation path
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Documentation tag must look like v0.2.3-1; got '${GITHUB_REF_NAME}'." >&2
            exit 1
          fi

          cobble_version="${BASH_REMATCH[1]}"
          patch_version="${BASH_REMATCH[2]}"
          release_version="${cobble_version}-${patch_version}"
          docs_root="${release_version}"

          echo "cobble_version=${cobble_version}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "docs_root=${docs_root}" >> "${GITHUB_OUTPUT}"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 0
          working-directory: "${{ github.workspace }}/docs"

      - name: Clean and build docs
        working-directory: docs
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.resolve.outputs.docs_root }}"
          release_version="${{ steps.resolve.outputs.release_version }}"
          commit_short="$(git rev-parse --short=8 HEAD)"
          repo_name="${GITHUB_REPOSITORY#*/}"
          baseurl="/${repo_name}/${root}"

          tmp_config="$(mktemp "${RUNNER_TEMP}/docs-build-meta.XXXXXX.yml")"
          trap 'rm -f "${tmp_config}"' EXIT
          cat > "${tmp_config}" <<EOF
          docs_root_label: ${release_version}
          docs_commit_label: ${commit_short}
          EOF

          bundle exec jekyll clean
          bundle exec jekyll build \
            --strict_front_matter \
            --baseurl "${baseurl}" \
            --config "_config.yml,${tmp_config}"

      - name: Publish to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${{ steps.resolve.outputs.docs_root }}"
          cobble_version="${{ steps.resolve.outputs.cobble_version }}"
          release_version="${{ steps.resolve.outputs.release_version }}"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish_branch="gh-pages"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          if git ls-remote --exit-code --heads "${remote_url}" "${publish_branch}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${publish_branch}" "${remote_url}" "${tmp_dir}" >/dev/null 2>&1
          else
            git init "${tmp_dir}" >/dev/null
            git -C "${tmp_dir}" checkout -b "${publish_branch}" >/dev/null
            git -C "${tmp_dir}" remote add origin "${remote_url}"
          fi

          mkdir -p "${tmp_dir}/${root}"
          rsync -a --delete "docs/_site/" "${tmp_dir}/${root}/"
          touch "${tmp_dir}/.nojekyll"

          mkdir -p "${tmp_dir}/${cobble_version}" "${tmp_dir}/latest"
          cat > "${tmp_dir}/${cobble_version}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=../${root}/" />
              <meta name="robots" content="noindex" />
              <title>Cobble Flink ${release_version} Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="../${root}/">Cobble Flink ${release_version} docs</a>...</p>
            </body>
          </html>
          EOF

          find "${tmp_dir}/latest" -mindepth 1 -depth -delete
          cat > "${tmp_dir}/latest/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=../${root}/" />
              <meta name="robots" content="noindex" />
              <title>Cobble Flink ${release_version} Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="../${root}/">Cobble Flink ${release_version} docs</a>...</p>
            </body>
          </html>
          EOF

          cat > "${tmp_dir}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=${root}/" />
              <meta name="robots" content="noindex" />
              <title>Cobble Flink Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="${root}/">Cobble Flink ${release_version} docs</a>...</p>
            </body>
          </html>
          EOF

          git -C "${tmp_dir}" add -A
          if git -C "${tmp_dir}" diff --cached --quiet; then
            echo "No docs changes to publish for Cobble Flink ${release_version}."
            exit 0
          fi

          git -C "${tmp_dir}" config user.name "github-actions[bot]"
          git -C "${tmp_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${tmp_dir}" commit -m "docs: publish ${release_version}" >/dev/null
          git -C "${tmp_dir}" push origin "HEAD:${publish_branch}" >/dev/null
