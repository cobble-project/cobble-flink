name: Publish Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish all Cobble Flink artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      RELEASE_MODULES: .,cobble-common,cobble-state,cobble-state-flink-1.19,cobble-state-flink-2.0,cobble-state-flink-2.1,cobble-sink,cobble-sink-flink-2.0,cobble-source,cobble-dist,cobble-dist-flink-1.19,cobble-dist-flink-2.0,cobble-dist-flink-2.1,cobble-flink-inspect,cobble-flink-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Derive release versions from tag
        shell: bash
        run: |
          set -euo pipefail
          release_base="${GITHUB_REF_NAME#v}"
          if [[ ! "${release_base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Release tag must look like v0.2.0-1; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "RELEASE_BASE=${release_base}" >> "${GITHUB_ENV}"

      - name: Set release versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          base = os.environ["RELEASE_BASE"]

          root_pom = Path("pom.xml")
          root_text = root_pom.read_text()
          root_text, count = re.subn(
              r"(<artifactId>cobble-flink</artifactId>\s*<version>)[^<]+(</version>)",
              rf"\g<1>{base}\g<2>",
              root_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update the root project version.")

          artifact_versions = {
              "cobble.flink.version.1.17": f"{base}-flink-1.17",
              "cobble.flink.version.1.19": f"{base}-flink-1.19",
              "cobble.flink.version.2.0": f"{base}-flink-2.0",
              "cobble.flink.version.2.1": f"{base}-flink-2.1",
          }
          for property_name, version in artifact_versions.items():
              pattern = rf"(<{re.escape(property_name)}>)[^<]+(</{re.escape(property_name)}>)"
              root_text, count = re.subn(
                  pattern,
                  rf"\g<1>{version}\g<2>",
                  root_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f"Could not update artifact version property {property_name}."
                  )
          root_pom.write_text(root_text)

          module_poms = [path for path in Path(".").glob("*/pom.xml")]
          for pom in module_poms:
              text = pom.read_text()
              parent, marker, remainder = text.partition("</parent>")
              if not marker:
                  raise SystemExit(f"Missing parent block in {pom}.")
              parent, count = re.subn(
                  r"(<version>)[^<]+(</version>)",
                  rf"\g<1>{base}\g<2>",
                  parent,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update the parent version in {pom}.")
              text = parent + marker + remainder
              for property_name, version in artifact_versions.items():
                  placeholder = "$" + "{" + property_name + "}"
                  text = text.replace(placeholder, version)
              pom.write_text(text)

          snapshots = []
          unresolved_artifact_versions = []
          for pom in [root_pom, *module_poms]:
              text = pom.read_text()
              if "SNAPSHOT" in text:
                  snapshots.append(str(pom))
              if "${cobble.flink.version." in text:
                  unresolved_artifact_versions.append(str(pom))
          if snapshots:
              raise SystemExit("SNAPSHOT versions remain in: " + ", ".join(snapshots))
          if unresolved_artifact_versions:
              raise SystemExit(
                  "Unresolved Cobble Flink artifact versions remain in: "
                  + ", ".join(unresolved_artifact_versions)
              )
          PY

          ./mvnw --batch-mode --no-transfer-progress \
            -pl "${RELEASE_MODULES}" -am -DskipTests validate

      - name: Publish signed artifacts
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Prelease-publish \
            -pl "${RELEASE_MODULES}" -am \
            -DskipTests \
            -Dspotless.check.skip=true \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            deploy
